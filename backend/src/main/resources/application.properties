spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Network: Supabase only resolves to IPv6 (AAAA), force JVM to use IPv6 ──
# Without this flag JDK prefers IPv4 and fails with UnknownHostException
# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA / Hibernate Settings
# IMPORTANT: set to 'validate' after first run to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Disable OSIV to enforce proper @Transactional usage and prevent lazy-loading surprises
spring.jpa.open-in-view=false

# Render injects PORT automatically; fallback to 8081 for local dev
server.port=${PORT:8081}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ──────────────────────────────────────────────────────────────────────────────
# JWT SECRET — READ FROM ENVIRONMENT VARIABLE
# ► Add the following line to backend/.env  (copy from .env.example)
# ► CW_JWT_SECRET=<paste your generated secret here>
# ──────────────────────────────────────────────────────────────────────────────
jwt.secret=${CW_JWT_SECRET}
jwt.expiration=86400000

# ACTUATOR & MONITORING (JVM Health & Metrics)
# ──────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,info,env,loggers
management.endpoint.health.show-details=always
management.endpoint.env.show-values=never
management.metrics.export.prometheus.enabled=false
# Key JVM metric names used by the monitoring dashboard:
#   jvm.memory.used, jvm.memory.max, system.cpu.usage, jvm.threads.live

app.seed-data=true

# ──────────────────────────────────────────────────────────────────────────────
# SMTP / EMAIL CONFIGURATION (Gmail)
# ► Set SMTP_USERNAME and SMTP_PASSWORD in backend/.env
# ► For Gmail: generate an "App Password" at https://myaccount.google.com/apppasswords
#   (requires 2-Step Verification to be enabled on your Google account)
# ──────────────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# CRITICAL: Do NOT test the SMTP connection at startup.
# Without this, Spring Boot verifies the SMTP server is reachable before the app starts.
# If the mail server is down, the entire ApplicationContext fails to load.
spring.mail.test-connection=false

# OTP expiry in minutes
app.otp.expiry-minutes=10
