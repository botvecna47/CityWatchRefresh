spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Network: Supabase only resolves to IPv6 (AAAA), force JVM to use IPv6 ──
# Without this flag JDK prefers IPv4 and fails with UnknownHostException
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA / Hibernate Settings
# IMPORTANT: set to 'validate' after first run to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8081
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ──────────────────────────────────────────────────────────────────────────────
# JWT SECRET — READ FROM ENVIRONMENT VARIABLE
# ► Add the following line to backend/.env  (copy from .env.example)
# ► CW_JWT_SECRET=<paste your generated secret here>
# ──────────────────────────────────────────────────────────────────────────────
jwt.secret=${CW_JWT_SECRET}
jwt.expiration=86400000
