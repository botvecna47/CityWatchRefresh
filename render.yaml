services:
  - type: web
    name: citywatch-backend
    runtime: java
    region: singapore   # closest to India
    plan: free

    # Render checks out the repo and runs this from the repo root
    rootDir: backend

    # Build: compile the fat JAR, skip tests (they need a DB)
    buildCommand: mvn clean package -DskipTests

    # Run: start the fat JAR produced by spring-boot-maven-plugin
    startCommand: java -jar target/citywatch-backend-0.0.1-SNAPSHOT.jar

    # Health check — Render pings this to confirm the app is up
    healthCheckPath: /actuator/health

    # ── Environment Variables ──────────────────────────────────────────────────
    # These MUST be set in the Render Dashboard under "Environment"
    # DO NOT commit real values here — this file only lists the keys.
    envVars:
      # Database (use Render's PostgreSQL service or an external DB like Supabase)
      - key: DB_URL
        sync: false          # Means: set this manually in the dashboard
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # JWT Secret — generate a long random string (min 32 chars)
      - key: CW_JWT_SECRET
        sync: false

      # CORS — paste your Vercel frontend URL here (no trailing slash)
      # Example: https://city-watch-refresh.vercel.app
      - key: cors.allowed-origins
        sync: false

      # Render automatically sets PORT, but we declare it for clarity
      - key: PORT
        value: "8080"
