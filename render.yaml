services:
  - type: web
    name: citywatch-backend
    runtime: docker
    region: singapore        # closest to India
    plan: free

    # Path to the Dockerfile, relative to repo root
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Health check — Render pings this to confirm the app is up
    healthCheckPath: /actuator/health

    # ── Environment Variables ──────────────────────────────────────────────────
    # Set these in the Render Dashboard under Environment → Add Env Var
    # DO NOT put real secrets here — this file only declares the keys.
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CW_JWT_SECRET
        sync: false
      - key: cors.allowed-origins
        sync: false
